<svg width="1280" height="390" viewBox="0 0 1280 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pema Wangchuk's learning loop</title>
  <desc id="desc">A four-step loop: understand the financial problem, model the system, build the interface, and refine through research.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EFF6F5"/>
    </linearGradient>
    <linearGradient id="rail" x1="126" y1="203" x2="1150" y2="203" gradientUnits="userSpaceOnUse">
      <stop stop-color="#168981"/>
      <stop offset="0.68" stop-color="#168981"/>
      <stop offset="1" stop-color="#E89312"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0B1727" fill-opacity="0.055"/>
    </pattern>
    <style>
      .surface { fill:url(#bg); }
      .grid { fill:url(#dots); }
      .border { stroke:#D6E1E8; }
      .card { fill:#FFFFFF; stroke:#DCE5EB; }
      .title { fill:#0B1727; }
      .copy { fill:#526273; }
      .eyebrow { fill:#0F766E; }
      .step { fill:#FFFFFF; }
      .footer { fill:#6B7B8C; }
      @media (prefers-color-scheme: dark) {
        .surface { fill:#0B1727; }
        .grid { opacity:.25; }
        .border { stroke:#324253; }
        .card { fill:#101E2D; stroke:#2A3A4A; }
        .title { fill:#F4F7FA; }
        .copy { fill:#AAB8C5; }
        .eyebrow { fill:#71D3CC; }
        .footer { fill:#8696A6; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1278" height="388" rx="26" class="surface border" stroke-width="2"/>
  <rect x="1" y="1" width="1278" height="388" rx="26" class="grid"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="62" y="64" class="eyebrow" font-size="14" font-weight="750" letter-spacing="2.3">A DELIBERATE LEARNING LOOP</text>
    <text x="62" y="105" class="title" font-size="30" font-weight="750" letter-spacing="-0.5">From a real problem to a clearer system.</text>

    <path d="M130 200H1150" stroke="url(#rail)" stroke-width="3" stroke-linecap="round"/>
    <path d="M1141 192L1151 200L1141 208" stroke="#E89312" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g>
      <rect x="62" y="145" width="254" height="150" rx="18" class="card"/>
      <circle cx="98" cy="181" r="18" fill="#168981"/>
      <text x="98" y="187" text-anchor="middle" class="step" font-size="14" font-weight="800">01</text>
      <text x="88" y="231" class="title" font-size="20" font-weight="740">Understand</text>
      <text x="88" y="259" class="copy" font-size="14">Frame the financial problem</text>
      <text x="88" y="280" class="copy" font-size="14">and the human need.</text>
    </g>

    <g>
      <rect x="338" y="145" width="254" height="150" rx="18" class="card"/>
      <circle cx="374" cy="181" r="18" fill="#168981"/>
      <text x="374" y="187" text-anchor="middle" class="step" font-size="14" font-weight="800">02</text>
      <text x="364" y="231" class="title" font-size="20" font-weight="740">Model</text>
      <text x="364" y="259" class="copy" font-size="14">Map incentives, logic, risk,</text>
      <text x="364" y="280" class="copy" font-size="14">and system boundaries.</text>
    </g>

    <g>
      <rect x="614" y="145" width="254" height="150" rx="18" class="card"/>
      <circle cx="650" cy="181" r="18" fill="#168981"/>
      <text x="650" y="187" text-anchor="middle" class="step" font-size="14" font-weight="800">03</text>
      <text x="640" y="231" class="title" font-size="20" font-weight="740">Build</text>
      <text x="640" y="259" class="copy" font-size="14">Turn the model into usable</text>
      <text x="640" y="280" class="copy" font-size="14">software and interfaces.</text>
    </g>

    <g>
      <rect x="890" y="145" width="328" height="150" rx="18" class="card"/>
      <circle cx="926" cy="181" r="18" fill="#E89312"/>
      <text x="926" y="187" text-anchor="middle" class="step" font-size="14" font-weight="800">04</text>
      <text x="916" y="231" class="title" font-size="20" font-weight="740">Refine</text>
      <text x="916" y="259" class="copy" font-size="14">Research the history, test the</text>
      <text x="916" y="280" class="copy" font-size="14">assumptions, improve the work.</text>
    </g>

    <text x="62" y="344" class="footer" font-size="13" font-weight="700" letter-spacing="1.1">ACCOUNTING · TYPESCRIPT · SOLIDITY · BITCOIN HISTORY</text>
    <text x="1218" y="344" text-anchor="end" class="footer" font-size="13" font-weight="700">LEARN → BUILD → EXPLAIN → REFINE</text>
  </g>
</svg>
