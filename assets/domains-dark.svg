<title id="t">Three domains: public finance, software engineering, open protocols</title>
<desc id="d">Public finance: Deputy Chief Finance Officer for cluster finance services — budgets, controls and accountability at ministry scale. Software engineering: Full-stack TypeScript. Next.js applications with real auth, real databases and interfaces that survive actual users. Open protocols: Bitcoin's history and cypherpunk roots, plus the Solidity contracts that let strangers coordinate without a middleman.</desc>
