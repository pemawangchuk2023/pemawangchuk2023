      <stop offset="0.48" stop-color="#0B1727"/>
      <stop offset="1" stop-color="#071A1C"/>
    </linearGradient>
    <radialGradient id="signal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1017 84) rotate(133) scale(451 351)">
      <stop stop-color="#F4A51C" stop-opacity="0.26"/>
