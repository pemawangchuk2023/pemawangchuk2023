<svg width="1280" height="460" viewBox="0 0 1280 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pema Wangchuk</title>
  <desc id="desc">Profile banner for a finance professional, systems builder, and Bitcoin history researcher.</desc>
  <defs>
