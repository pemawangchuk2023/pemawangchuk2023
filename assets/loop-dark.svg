<title id="t">How I work: understand, model, build, explain, refine</title>
<desc id="d">01 Understand: Find the financial question under the request. 02 Model: Map incentives, data and failure modes first. 03 Build: Ship a clear interface over auditable logic. 04 Explain: If it cannot be explained, it is not done. Then refine and repeat.</desc>
