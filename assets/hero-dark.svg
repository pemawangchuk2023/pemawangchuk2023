<title id="t">Pema Wangchuk — Deputy Chief Finance Officer · Cluster Finance Services, Bhutan</title>
<desc id="d">PUBLIC FINANCE  ×  SOFTWARE ENGINEERING. Public-sector finance by day, production software by night. I care about the same thing in both: systems that stay honest when nobody is watching. Based in Thimphu, Bhutan. Open to collaborate.</desc>
