<title id="t">Pema Wangchuk — Deputy Chief Finance Officer · Cluster Finance Services</title>
<desc id="d">PUBLIC FINANCE × SOFTWARE. Public-sector finance by day, production software by night. I care about systems that stay honest when nobody is watching. Based in Thimphu, Bhutan. Open to collaborate.</desc>
